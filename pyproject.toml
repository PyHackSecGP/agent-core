[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-core"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.34.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["agent_core*"]
